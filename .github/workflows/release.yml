name: Release

on:
  push:
    branches: [main, beta]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Only run if CI passes (the ci.yml workflow also runs on push to main/next)
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # `pnpm publish` (utilisé par semantic-release pour résoudre les `workspace:*`)
      # lit l'auth depuis ~/.npmrc. On y écrit le placeholder ${NPM_TOKEN} : pnpm
      # le résout depuis l'env au moment du publish (le jeton n'est pas écrit en clair).
      - name: Configure npm auth for pnpm publish
        run: echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" >> ~/.npmrc

      - name: Release
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Debug temporaire : tracer le filtrage des commits + l'analyse gitmoji.
          DEBUG: 'msr:commitsFilter,semantic-release-gitmoji'
